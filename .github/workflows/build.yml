
name: PLAY MAX Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Extract source ZIP if present
        run: |
          mkdir -p android-source
          ZIP_FILE=$(find . -maxdepth 3 -type f \
            -iname 'PLAY_MAX_VLC_PLAYER_BOX_ANCHOR_FIX_SOURCE.zip' \
            -print -quit)

          if [ -n "$ZIP_FILE" ]; then
            unzip -o "$ZIP_FILE" -d android-source
          fi

      - name: Locate Android Gradle project
        id: project
        run: |
          PROJECT_FILE=$(find . -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path './.git/*' \
            -not -path './.gradle/*' \
            -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: settings.gradle not found"
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found Android project: $PROJECT_DIR"

      - name: Build Debug APK
        run: |
          gradle --no-daemon \
            -p "${{ steps.project.outputs.dir }}" \
            :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PLAY-MAX-debug-apk
          path: |
            **/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
 
