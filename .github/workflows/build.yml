name: Build PLAY MAX APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.13'

jobs:
  build:
    name: Build PLAY MAX APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify ZIP File
        run: |
          test -f "PLAY_MAX_Android_Source_Fixed (1).zip"
          echo "ZIP file found successfully"

      - name: Extract ZIP File
        run: |
          mkdir -p android_source
          unzip -q "PLAY_MAX_Android_Source_Fixed (1).zip" -d android_source
          test -d android_source/PLAY_MAX_Android_Source

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '${{ env.JAVA_VERSION }}'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '${{ env.GRADLE_VERSION }}'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Check Gradle version
        run: gradle --version

      - name: Build PLAY MAX debug APK
        working-directory: android_source/PLAY_MAX_Android_Source
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK
        run: |
          test -f android_source/PLAY_MAX_Android_Source/app/build/outputs/apk/debug/app-debug.apk
          echo "APK created successfully"

      - name: Upload PLAY MAX Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PLAY-MAX-debug-apk
          path: android_source/PLAY_MAX_Android_Source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
