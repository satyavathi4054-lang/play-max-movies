
name: Build PLAY MAX VLC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'PLAY_MAX_VLC_INTEGRATION_SOURCE.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.13'

jobs:
  build:
    name: Build PLAY MAX VLC APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify VLC source ZIP
        run: |
          test -f PLAY_MAX_VLC_INTEGRATION_SOURCE.zip
          echo "VLC source ZIP found"

      - name: Extract PLAY MAX source
        run: |
          mkdir -p android-source
          unzip -q PLAY_MAX_VLC_INTEGRATION_SOURCE.zip -d android-source

          test -f android-source/PLAY_MAX_Android_Source/app/build.gradle
          test -f android-source/PLAY_MAX_Android_Source/settings.gradle

          echo "Source extraction successful"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Check Gradle version
        run: gradle --version

      - name: Build PLAY MAX debug APK
        working-directory: android-source/PLAY_MAX_Android_Source
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          test -f android-source/PLAY_MAX_Android_Source/app/build/outputs/apk/debug/app-debug.apk
          echo "APK created successfully"

      - name: Upload PLAY MAX VLC APK
        uses: actions/upload-artifact@v4
        with:
          name: PLAY-MAX-VLC-APK
          path: android-source/PLAY_MAX_Android_Source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
