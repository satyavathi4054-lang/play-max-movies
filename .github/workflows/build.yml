
name: Build PLAY MAX Main and Admin APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: Extract PLAY MAX Source ZIP
        run: |
          test -f PLAY_MAX_THREE_COMPLAINTS_SOURCE_FIXED.zip
          mkdir -p source
          unzip -q PLAY_MAX_THREE_COMPLAINTS_SOURCE_FIXED.zip -d source

      - name: Verify Projects
        run: |
          test -f source/PLAY_MAX_Android_Source/settings.gradle
          test -f source/PLAY_MAX_Android_Source/app/build.gradle
          test -f source/PLAY_MAX_ANDROID_APP/settings.gradle
          test -f source/PLAY_MAX_ANDROID_APP/app/build.gradle

          echo "Main and Admin projects verified."

      - name: Build Main App
        run: |
          gradle --no-daemon --stacktrace \
            -p source/PLAY_MAX_Android_Source assembleDebug

      - name: Build Admin App
        run: |
          gradle --no-daemon --stacktrace \
            -p source/PLAY_MAX_ANDROID_APP assembleDebug

      - name: Upload Main APK
        uses: actions/upload-artifact@v4
        with:
          name: PLAY-MAX-MAIN-APK
          path: source/PLAY_MAX_Android_Source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: PLAY-MAX-ADMIN-APK
          path: source/PLAY_MAX_ANDROID_APP/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
 
