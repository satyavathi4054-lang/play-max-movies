
name: Build PLAY MAX Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: Verify project files
        run: |
          test -f PLAY_MAX_Android_Source/settings.gradle
          test -f PLAY_MAX_Android_Source/app/build.gradle
          test -f PLAY_MAX_ANDROID_APP/settings.gradle
          test -f PLAY_MAX_ANDROID_APP/app/build.gradle

      - name: Build PLAY MAX Main APK
        working-directory: PLAY_MAX_Android_Source
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Build PLAY MAX Admin APK
        working-directory: PLAY_MAX_ANDROID_APP
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload Main APK
        uses: actions/upload-artifact@v4
        with:
          name: PLAY-MAX-MAIN-APK
          path: PLAY_MAX_Android_Source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: PLAY-MAX-ADMIN-APK
          path: PLAY_MAX_ANDROID_APP/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
 
