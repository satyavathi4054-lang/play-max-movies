
name: PLAY MAX VIDEO FIXES BUILD

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK Packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-36"
          sdkmanager --install "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract Source ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -type f -iname '*VIDEO*FIXES*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Source ZIP not found"
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Locate Android Project
        run: |
          PROJECT_DIR=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: |
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
            "$PROJECT_DIR/gradlew" --no-daemon :app:assembleDebug
          else
            gradle --no-daemon -p "$PROJECT_DIR" :app:assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PLAY-MAX-VIDEO-FIXES-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
 
