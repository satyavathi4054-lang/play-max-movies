
name: Build PLAY MAX VLC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'PLAY_MAX_VLC_INTEGRATION_SOURCE.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify new VLC source ZIP
        run: test -f PLAY_MAX_VLC_INTEGRATION_SOURCE.zip

      - name: Extract PLAY MAX VLC source
        run: |
          mkdir -p android-source
          unzip -q PLAY_MAX_VLC_INTEGRATION_SOURCE.zip -d android-source
          test -f android-source/PLAY_MAX_Android_Source/app/build.gradle
          test -f android-source/PLAY_MAX_Android_Source/settings.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Build PLAY MAX debug APK
        working-directory: android-source/PLAY_MAX_Android_Source
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PLAY-MAX-VLC-APK
          path: android-source/PLAY_MAX_Android_Source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
