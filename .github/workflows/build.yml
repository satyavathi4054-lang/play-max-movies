 
name: PLAY MAX APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK Packages
        run: |
          sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-36"
          sdkmanager --install "build-tools;36.0.0"

      - name: Extract PLAY MAX Source
        run: |
          unzip -q PLAY_MAX_FULLSCREEN_BOTTOM_GAP_FIXED_V2_SOURCE.zip -d extracted

      - name: Build APK
        run: |
          gradle -p extracted/PLAY_MAX_Android_Source :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PLAY-MAX-APK
          path: extracted/PLAY_MAX_Android_Source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
