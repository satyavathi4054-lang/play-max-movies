
name: PLAY MAX Final All Three Fix Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.13'
  SOURCE_ZIP: 'PLAY_MAX_FINAL_ALL_THREE_FIX.zip'
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Build PLAY MAX Final APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify Final Source ZIP
        shell: bash
        run: |
          set -e
          test -f "$SOURCE_ZIP"
          echo "Final source ZIP found."

      - name: Extract PLAY MAX Android Source
        shell: bash
        run: |
          set -e
          mkdir -p android-source
          unzip -oq "$SOURCE_ZIP" -d android-source

          PROJECT_DIR="android-source/PLAY_MAX_Android_Source"

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project extracted successfully."

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            ls -la "$ANDROID_HOME/cmdline-tools" || true
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses || true

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -e
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Build PLAY MAX APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          gradle --no-daemon --stacktrace :app:assembleDebug

          echo "PLAY MAX APK build completed."

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: PLAY-MAX-FINAL-ALL-THREE-FIX-APK
          path: android-source/PLAY_MAX_Android_Source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
 
