
name: PLAY MAX Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'PLAY_MAX_VLC_INLINE_CORRECTED_SOURCE.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build PLAY MAX APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Verify Source ZIP
      - name: Check Source ZIP
        run: |
          test -f PLAY_MAX_VLC_INLINE_CORRECTED_SOURCE.zip
          echo "Source ZIP found successfully"

      # 3. Extract Android Project
      - name: Extract Android Source
        run: |
          mkdir -p android-source
          unzip -o PLAY_MAX_VLC_INLINE_CORRECTED_SOURCE.zip -d android-source

      # 4. Locate Android Project
      - name: Find Android Project
        shell: bash
        run: |
          PROJECT_FILE=$(find android-source -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: App Gradle file not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      # 5. Install Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 6. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 'latest'
          accept-android-sdk-licenses: true
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      # 7. Verify Android SDK
      - name: Verify Android SDK
        run: |
          adb version
          sdkmanager --list_installed

      # 8. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # 9. Build Android APK
      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon :app:assembleDebug
          else
            gradle --no-daemon :app:assembleDebug
          fi

      # 10. Verify APK
      - name: Verify APK
        run: |
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -name '*.apk' -type f -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "APK generated successfully: $APK"

      # 11. Upload APK
      - name: Upload PLAY MAX APK
        uses: actions/upload-artifact@v4
        with:
          name: PLAY-MAX-DEBUG-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
 
