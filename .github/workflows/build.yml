
name: PLAY MAX Firestore Migration Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'PLAY_MAX_FIRESTORE_MIGRATION_SOURCE.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify Source ZIP
        run: |
          test -f PLAY_MAX_FIRESTORE_MIGRATION_SOURCE.zip

      - name: Extract Android Source
        shell: bash
        run: |
          set -e
          mkdir -p android-source
          unzip -oq PLAY_MAX_FIRESTORE_MIGRATION_SOURCE.zip -d android-source

          SETTINGS=$(find android-source -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: Android app module not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build PLAY MAX APK
        shell: bash
        run: |
          set -e
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
            "$PROJECT_DIR/gradlew" --no-daemon :app:assembleDebug
          else
            gradle --no-daemon :app:assembleDebug
          fi
        working-directory: .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PLAY-MAX-FINAL-COMPLAINTS-FIXED-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
 
