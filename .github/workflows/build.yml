
name: Build PLAY MAX User APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Find Latest User ZIP
        shell: bash
        run: |
          ZIP_FILE="PLAY_MAX_USER_ADMOB_FIREBASE_INTEGRATION.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: User App ZIP not found"
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract User Source
        run: |
          mkdir -p extracted_user
          unzip -q "$ZIP_FILE" -d extracted_user

      - name: Verify Android Project
        run: |
          PROJECT_DIR="extracted_user/PLAY_MAX_Android_Source"

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/google-services.json"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build PLAY MAX User APK
        run: |
          gradle --no-daemon --stacktrace \
            -p "$PROJECT_DIR" \
            assembleDebug

      - name: Upload PLAY MAX User APK
        uses: actions/upload-artifact@v4
        with:
          name: PLAY-MAX-USER-ADMOB-APK
          path: extracted_user/PLAY_MAX_Android_Source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
 
