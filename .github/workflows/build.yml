 
name: PLAY MAX User App APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract User App Source
        run: |
          unzip -oq PLAY_MAX_USER_APP_ONLY_DOWNLOAD_LOADING_LOGO.zip -d .

      - name: Build User APK
        run: |
          gradle --no-daemon -p PLAY_MAX_Android_Source :app:assembleDebug

      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: PLAY-MAX-USER-APK
          path: PLAY_MAX_Android_Source/app/build/outputs/apk/debug/app-debug.apk
