
name: PLAY MAX APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate and Extract VLC Source ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -name 'PLAY_MAX_VLC_INTEGRATION_SOURCE.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: VLC source ZIP not found"
            find . -maxdepth 2 -type f
            exit 1
          fi

          mkdir -p extracted_source
          unzip -q "$ZIP_FILE" -d extracted_source

          PROJECT_DIR=$(find extracted_source -name settings.gradle -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle missing inside ZIP"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build PLAY MAX APK
        run: gradle --no-daemon -p "$PROJECT_DIR" :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PLAY-MAX-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
 
