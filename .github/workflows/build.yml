
name: PLAY MAX Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'PLAY_MAX_VLC_INLINE_CORRECTED_SOURCE.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Source ZIP
        run: |
          test -f PLAY_MAX_VLC_INLINE_CORRECTED_SOURCE.zip

      - name: Extract Android Source
        run: |
          mkdir -p android-source
          unzip -o PLAY_MAX_VLC_INLINE_CORRECTED_SOURCE.zip -d android-source

      - name: Find Android Project
        run: |
          PROJECT_DIR=$(find android-source -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs dirname)
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          test -f "$PROJECT_DIR/app/build.gradle" -o -f "$PROJECT_DIR/app/build.gradle.kts"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon :app:assembleDebug
          else
            gradle --no-daemon :app:assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PLAY-MAX-DEBUG-APK
          path: android-source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
 
