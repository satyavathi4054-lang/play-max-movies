
name: Build PLAY MAX User APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK Packages
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK manager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Find PLAY MAX User Project
        shell: bash
        run: |
          PROJECT_DIR=""

          while IFS= read -r FILE; do
            DIR=$(dirname "$FILE")

            if [ -f "$DIR/app/build.gradle" ] && \
               grep -q "com.playmax.movies" "$DIR/app/build.gradle"; then
              PROJECT_DIR="$DIR"
              break
            fi

            if [ -f "$DIR/app/build.gradle.kts" ] && \
               grep -q "com.playmax.movies" "$DIR/app/build.gradle.kts"; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/.gradle/*')

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: PLAY MAX User App project not found!"
            exit 1
          fi

          echo "Found project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build PLAY MAX User APK
        shell: bash
        run: |
          gradle --no-daemon --stacktrace \
            -p "$PROJECT_DIR" \
            assembleDebug

      - name: Upload PLAY MAX APK
        uses: actions/upload-artifact@v4
        with:
          name: PLAY-MAX-USER-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
 
