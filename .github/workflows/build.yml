 
name: PLAY MAX Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract PLAY MAX Source
        run: |
          unzip -o PLAY_MAX_ALL_COMPLAINTS_FINAL_SOURCE.zip -d .

      - name: Verify Project
        run: |
          test -f PLAY_MAX_Android_Source/settings.gradle
          test -f PLAY_MAX_Android_Source/app/build.gradle

      - name: Build PLAY MAX APK
        working-directory: PLAY_MAX_Android_Source
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PLAY-MAX-FINAL-APK
          path: PLAY_MAX_Android_Source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
