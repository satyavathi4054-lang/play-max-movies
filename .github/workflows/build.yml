
name: Build PLAY MAX User APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'PLAY_MAX_USER_APP_BANNER_SLIDER_TELEGRAM_FIXED.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract User App Source
        run: |
          unzip -oq PLAY_MAX_USER_APP_BANNER_SLIDER_TELEGRAM_FIXED.zip -d .
          test -f PLAY_MAX_Android_Source/settings.gradle
          test -f PLAY_MAX_Android_Source/app/build.gradle
          test -f PLAY_MAX_Android_Source/app/src/main/assets/index.html

      - name: Build User App APK
        run: |
          gradle --no-daemon --stacktrace assembleDebug
        working-directory: PLAY_MAX_Android_Source

      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: PLAY-MAX-USER-APK
          path: PLAY_MAX_Android_Source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
 
