
name: Build PLAY MAX Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: Locate Android Projects
        id: locate
        shell: bash
        run: |
          MAIN=""
          ADMIN=""

          while IFS= read -r file; do
            if grep -q "com.playmax.movies" "$file"; then
              MAIN="$(dirname "$(dirname "$file")")"
            fi

            if grep -q "com.playmax.admin" "$file"; then
              ADMIN="$(dirname "$(dirname "$file")")"
            fi
          done < <(find . -type f -path '*/app/build.gradle')

          echo "Main project: $MAIN"
          echo "Admin project: $ADMIN"

          test -n "$MAIN" || {
            echo "Main App project not found"
            exit 1
          }

          test -n "$ADMIN" || {
            echo "Admin App project not found"
            exit 1
          }

          echo "main_dir=$MAIN" >> "$GITHUB_OUTPUT"
          echo "admin_dir=$ADMIN" >> "$GITHUB_OUTPUT"

      - name: Build PLAY MAX Main APK
        run: |
          gradle --no-daemon --stacktrace \
            -p "${{ steps.locate.outputs.main_dir }}" assembleDebug

      - name: Build PLAY MAX Admin APK
        run: |
          gradle --no-daemon --stacktrace \
            -p "${{ steps.locate.outputs.admin_dir }}" assembleDebug

      - name: Upload Main APK
        uses: actions/upload-artifact@v4
        with:
          name: PLAY-MAX-MAIN-APK
          path: ${{ steps.locate.outputs.main_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: PLAY-MAX-ADMIN-APK
          path: ${{ steps.locate.outputs.admin_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
 
