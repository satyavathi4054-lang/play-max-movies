
name: Build PLAY MAX Main APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: Extract Main App ZIP
        run: |
          mkdir -p extracted
          unzip -q PLAY_MAX_Android_Source_READY_FOR_BUILD.zip -d extracted

      - name: Find Android Project
        id: project
        run: |
          SETTINGS=$(find extracted -type f \( \
            -name settings.gradle -o \
            -name settings.gradle.kts \
            \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "Android settings.gradle not found"
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project: $PROJECT_DIR"

      - name: Build Main APK
        run: |
          gradle --no-daemon --stacktrace \
            -p "${{ steps.project.outputs.project_dir }}" \
            assembleDebug

      - name: Find APK
        id: apk
        run: |
          APK=$(find "${{ steps.project.outputs.project_dir }}" \
            -type f -path '*/build/outputs/apk/*/*.apk' | head -n 1)

          test -n "$APK" || {
            echo "APK not generated"
            exit 1
          }

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload Main APK
        uses: actions/upload-artifact@v4
        with:
          name: PLAY-MAX-MAIN-APK
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
 
