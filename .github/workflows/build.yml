  
name: Build Play Max APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'PLAY_MAX_PLAYER_DIRECT_STREAM_PATCH.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.13'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify new source ZIP exists
        run: test -f PLAY_MAX_PLAYER_DIRECT_STREAM_PATCH.zip

      - name: Extract updated PLAY MAX Android source
        run: |
          mkdir -p android-source
          unzip -o PLAY_MAX_PLAYER_DIRECT_STREAM_PATCH.zip -d android-source
          test -f android-source/PLAY_MAX_Android_Source/app/build.gradle
          test -f android-source/PLAY_MAX_Android_Source/settings.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK from updated source
        working-directory: android-source/PLAY_MAX_Android_Source
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PLAY-MAX-PLAYER-FIX-APK
          path: android-source/PLAY_MAX_Android_Source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
