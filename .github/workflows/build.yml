
name: PLAY MAX Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        run: |
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f | head -1)

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify Gradle
        run: gradle --version

      - name: Extract source ZIP
        run: |
          mkdir -p android-source

          ZIP_FILE=$(find . -maxdepth 3 -type f \
            -iname 'PLAY_MAX_VLC_PLAYER_BOX_ANCHOR_FIX_SOURCE.zip' \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "Source ZIP not found"
            exit 1
          fi

          unzip -o "$ZIP_FILE" -d android-source

      - name: Locate Android project
        id: project
        run: |
          PROJECT_FILE=$(find android-source -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "Gradle settings file not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJECT_DIR"

      - name: Build Debug APK
        run: |
          cd "${{ steps.project.outputs.dir }}"
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PLAY-MAX-debug-apk
          path: android-source/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
 
