 
name: PLAY MAX User App Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Check Source ZIP
        run: |
          test -f PLAY_MAX_USER_APP_PREMIUM_WATCH_DIALOG_FIXED.zip

      - name: Extract Updated Source
        run: |
          rm -rf PLAY_MAX_Android_Source
          unzip -oq PLAY_MAX_USER_APP_PREMIUM_WATCH_DIALOG_FIXED.zip -d .

      - name: Build APK
        run: |
          gradle --no-daemon \
            -p PLAY_MAX_Android_Source \
            :app:assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PLAY-MAX-USER-APK
          path: PLAY_MAX_Android_Source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
